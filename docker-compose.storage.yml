# Local S3-compatible object store and ClamAV daemon (FIG-1257, P1.13).
# Separate from docker-compose.yml so the database stack stays light:
#
#   docker compose -f docker-compose.storage.yml up -d --wait
#   docker compose -f docker-compose.storage.yml down        (add -v to wipe the data)
#
# Plain S3 protocol and plain clamd: nothing here is vendor-specific, and the
# app's S3 driver is used unchanged. The credentials below are DEV ONLY, made
# up for this computer. Never reuse them for staging or production.
#
# Env the app needs to use it (put in the local .env):
#   STORAGE_DRIVER=s3
#   S3_ENDPOINT=http://localhost:59000
#   S3_REGION=us-east-1
#   S3_BUCKET=figbloom-crm-dev
#   S3_ACCESS_KEY_ID=devminioadmin
#   S3_SECRET_ACCESS_KEY=dev-only-minio-secret
#   S3_FORCE_PATH_STYLE=true
#   CLAMD_HOST=localhost
#   CLAMD_PORT=53310
name: figbloom_crm_storage

services:
  # SeaweedFS (Apache 2.0) with its S3 gateway: a plain S3-compatible store that
  # verifies SigV4 signatures, which is what the app's S3 driver needs.
  objectstore:
    image: chrislusf/seaweedfs:latest
    container_name: figbloom_crm_objectstore
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=256
    environment:
      AWS_ACCESS_KEY_ID: devminioadmin # dev only
      AWS_SECRET_ACCESS_KEY: dev-only-minio-secret # dev only
    ports:
      - "127.0.0.1:59000:8333" # S3 API
    volumes:
      - figbloom_crm_objects:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9333/cluster/status && curl -s -o /dev/null http://127.0.0.1:8333/"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Creates the private buckets once the store is up, then exits. No anonymous
  # access is configured: every read goes through a signed link.
  createbucket:
    image: chrislusf/seaweedfs:latest
    container_name: figbloom_crm_createbucket
    depends_on:
      objectstore:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        (echo "s3.bucket.create -name figbloom-crm-dev"; echo "s3.bucket.create -name figbloom-crm-test") | weed shell -master=objectstore:9333

  clamav:
    image: clamav/clamav:stable
    container_name: figbloom_crm_clamav
    restart: unless-stopped
    ports:
      - "127.0.0.1:53310:3310" # clamd
    volumes:
      - figbloom_crm_clamav_db:/var/lib/clamav
    # First start downloads the signature database, which takes a few minutes.
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

volumes:
  figbloom_crm_objects:
  figbloom_crm_clamav_db:
