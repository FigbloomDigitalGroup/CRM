services:
  postgres:
    image: postgres:16-alpine
    container_name: figbloom_crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: figbloom
      POSTGRES_PASSWORD: figbloom
      POSTGRES_DB: figbloom_crm_dev
    ports:
      - "55432:5432"
    volumes:
      - figbloom_crm_pg_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    # Lets `docker compose up -d --wait` (npm run test:local) block until
    # Postgres accepts connections, so the suite never races the container.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U figbloom -d figbloom_crm_dev"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  figbloom_crm_pg_data:
