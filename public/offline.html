<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Offline · Figbloom CRM</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f3ef; color: #17181a; }
  main { max-width: 380px; width: 100%; text-align: center; background: #fff; border-radius: 16px; padding: 32px 28px; box-shadow: 0 1px 2px rgba(20,20,15,.06), 0 8px 24px rgba(20,20,15,.06); box-sizing: border-box; }
  h1 { font-size: 22px; margin: 16px 0 8px; letter-spacing: -0.02em; }
  p { font-size: 15px; line-height: 1.55; color: #4a4d47; margin: 0 0 14px; }
  button { min-height: 48px; padding: 0 22px; border: 0; border-radius: 999px; background: #1d5f8f; color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; }
  button:focus-visible { outline: 3px solid #ff9400; outline-offset: 2px; }
  button:hover { background: #134566; }
  img { width: 56px; height: 56px; border-radius: 14px; }
  #queued { font-weight: 600; color: #7a4a00; background: #fdf3e2; border-radius: 8px; padding: 10px 12px; font-size: 14px; }
  @media (prefers-color-scheme: dark) { body { background: #17181a; color: #eef0ee; } main { background: #202226; box-shadow: none; } p { color: #b9beb6; } #queued { color: #ffb347; background: #3a2d12; } button { background: #3b86bd; color: #08202f; } button:hover { background: #5a9fd0; } }
</style>
</head>
<body>
<main>
  <img src="/figbloom-logo.jpg" alt="">
  <h1>You are offline</h1>
  <p>Figbloom CRM could not reach the internet. Anything you already saved on this phone is kept and will be sent when you are back online.</p>
  <p id="queued" role="status" hidden></p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>
  // Reads only the count of waiting changes this phone is holding (the app keeps one queue per person and organisation).
  try {
    var n = 0;
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf("figbloom-offline-queue:") === 0) {
        var items = JSON.parse(localStorage.getItem(k) || "[]");
        for (var j = 0; j < items.length; j++) if (items[j].state === "WAITING") n++;
      }
    }
    if (n > 0) {
      var el = document.getElementById("queued");
      el.textContent = n + (n === 1 ? " change is" : " changes are") + " waiting to sync.";
      el.hidden = false;
    }
  } catch (e) {}
</script>
</body>
</html>
