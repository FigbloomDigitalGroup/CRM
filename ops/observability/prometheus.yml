# Prometheus for the staging stack (FIG-1124, P1.02). Plain open-source Prometheus: the same files work on AWS.
# The metrics token is written to a file by the container entrypoint from the METRICS_TOKEN environment variable (never stored here).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: figbloom
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics-token
    static_configs:
      - targets: ["app:3000"]

  # Nightly backup job (docker-compose.staging.yml, service backup-metrics): last success, size, duration, files kept.
  - job_name: backup
    metrics_path: /backup.prom
    static_configs:
      - targets: ["backup-metrics:9101"]

  # Uptime probes through the blackbox exporter: health (must answer 200 and "status":"ok") and the login page (200).
  - job_name: health-probe
    metrics_path: /probe
    params:
      module: [health]
    static_configs:
      - targets: ["http://app:3000/api/health"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: login-probe
    metrics_path: /probe
    params:
      module: [page]
    static_configs:
      - targets: ["http://app:3000/login"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
