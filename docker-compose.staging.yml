# Local staging stack (FIG-1123 P1.01, FIG-1256 P1.12): production shape on this computer.
# Same Docker image as production, NODE_ENV=production, FIGBLOOM_ENVIRONMENT=staging, no dev accounts,
# its own plain PostgreSQL (figbloom_crm_staging), an S3-compatible store, ClamAV and a mail sandbox (Mailpit).
# Own compose project, own volumes and own ports: it never touches the dev/test database or the storage stack.
#
# Secrets live OUTSIDE the repo in C:\Users\Admin\.figbloom\staging.env (see docs/STAGING.md, "Local staging stack").
#
#   docker build -t figbloom-crm:staging .
#   docker compose -p figbloom_crm_staging -f docker-compose.staging.yml --env-file C:\Users\Admin\.figbloom\staging.env up -d --wait
#   docker compose -p figbloom_crm_staging -f docker-compose.staging.yml --env-file ... run --rm migrate    (once per deploy)
#
# Ports (localhost only): app 33000, PostgreSQL 35432, mail sandbox UI 38025 (SMTP 31025), S3 59100, clamd 53311.
name: figbloom_crm_staging

x-app-env: &app-env
  NODE_ENV: production
  FIGBLOOM_ENVIRONMENT: staging
  ACTIVE_RELEASE: v1
  APP_BASE_URL: http://localhost:33000
  DATABASE_URL: postgresql://figbloom:${STAGING_PG_OWNER_PASSWORD:?set in the secrets file}@postgres:5432/figbloom_crm_staging?schema=public
  APP_DATABASE_URL: postgresql://figbloom_app:${APP_DB_PASSWORD:?}@postgres:5432/figbloom_crm_staging?schema=public
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
  APP_DB_NAMES: figbloom_crm_staging
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_SECURE: "false"
  SMTP_FROM: FigBloom CRM Staging <no-reply@staging.example.com>
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://objectstore:8333
  # Signed links go to the browser on the host, which reaches the store on its published port.
  S3_PUBLIC_ENDPOINT: http://localhost:59100
  S3_REGION: us-east-1
  S3_BUCKET: figbloom-crm-staging
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
  S3_FORCE_PATH_STYLE: "true"
  CLAMD_HOST: clamav
  CLAMD_PORT: "3310"
  CRON_SECRET: ${CRON_SECRET:?}
  METRICS_TOKEN: ${METRICS_TOKEN:?}
  # ALLOW_DEV_ACCOUNTS and DEV_SESSION_SECRET are deliberately absent (CLAUDE.md rule 10).

services:
  postgres:
    image: postgres:16-alpine
    container_name: figbloom_crm_staging_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: figbloom
      POSTGRES_PASSWORD: ${STAGING_PG_OWNER_PASSWORD:?}
      POSTGRES_DB: figbloom_crm_staging
    ports:
      - "127.0.0.1:35432:5432"
    volumes:
      - figbloom_crm_staging_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U figbloom -d figbloom_crm_staging"]
      interval: 3s
      timeout: 3s
      retries: 20

  objectstore:
    image: chrislusf/seaweedfs:latest
    container_name: figbloom_crm_staging_objectstore
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=256
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
    ports:
      - "127.0.0.1:59100:8333"
    volumes:
      - figbloom_crm_staging_objects:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9333/cluster/status && curl -s -o /dev/null http://127.0.0.1:8333/"]
      interval: 3s
      timeout: 3s
      retries: 30

  createbucket:
    image: chrislusf/seaweedfs:latest
    container_name: figbloom_crm_staging_createbucket
    depends_on:
      objectstore:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Idempotent: "already exists" on a re-run is fine, so `up` can be repeated.
        out=$$(echo "s3.bucket.create -name figbloom-crm-staging" | weed shell -master=objectstore:9333 2>&1); echo "$$out"
        echo "$$out" | grep -qE "created bucket|already exists"

  clamav:
    image: clamav/clamav:stable
    container_name: figbloom_crm_staging_clamav
    restart: unless-stopped
    ports:
      - "127.0.0.1:53311:3310"
    volumes:
      - figbloom_crm_staging_clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  # Mail sandbox: accepts every message, delivers nothing. Read them at http://localhost:38025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: figbloom_crm_staging_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:38025:8025"
      - "127.0.0.1:31025:1025"

  # One-off deploy job: migrate, bootstrap-role, grant-role. Not started by `up` (profile "job").
  migrate:
    image: figbloom-crm:staging
    profiles: ["job"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      RUN_MIGRATIONS_ON_START: "true"
    command: ["true"]

  app:
    image: figbloom-crm:staging
    container_name: figbloom_crm_staging_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment: *app-env
    ports:
      - "127.0.0.1:33000:3000"

  # The scheduler production has to provide (docs/DEPLOYMENT.md): calls the job endpoint once a minute so scheduled jobs
  # (file purge, notifications sweep, ...) run and the job-lag gauge means something. Only the status code is logged.
  scheduler:
    image: curlimages/curl:8.10.1
    container_name: figbloom_crm_staging_scheduler
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      CRON_SECRET: ${CRON_SECRET:?}
    entrypoint:
      - /bin/sh
      - -c
      - while true; do curl -s -o /dev/null -m 120 -w 'cron/jobs %{http_code}\n' -X POST -H "Authorization:Bearer $$CRON_SECRET" http://app:3000/api/cron/jobs; sleep 60; done

  # Nightly database backup (FIG-1258 / FIG-1125, docs/BACKUP_RESTORE.md): pg_dump -Fc at 01:00 UTC, checked, 14 daily + 8 weekly +
  # 12 monthly copies on the backups volume, metrics for the alert rules. On this computer the copies stay on this computer's volume and are
  # not encrypted: off-host copy and encryption need storage and keys a person provides.
  backup:
    image: postgres:16-alpine
    container_name: figbloom_crm_staging_backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: figbloom
      PGPASSWORD: ${STAGING_PG_OWNER_PASSWORD:?}
      PGDATABASE: figbloom_crm_staging
      BACKUP_DIR: /backups
      BACKUP_HOUR_UTC: "01"
      BACKUP_ON_START: "true"
    entrypoint: ["/bin/sh", "/ops/backup-nightly.sh"]
    volumes:
      - ./ops/backup/backup-nightly.sh:/ops/backup-nightly.sh:ro
      - ./ops/backup/audit-export.sql:/ops/audit-export.sql:ro
      - ./ops/backup/audit-verified-head.sql:/ops/audit-verified-head.sql:ro
      - figbloom_crm_staging_backups:/backups

  # Serves the backup metrics file to Prometheus (read-only view of the backups volume's metrics folder).
  backup-metrics:
    image: busybox:1.36
    container_name: figbloom_crm_staging_backup_metrics
    restart: unless-stopped
    command: ["httpd", "-f", "-p", "9101", "-h", "/backups/metrics"]
    depends_on:
      backup:
        condition: service_started
    volumes:
      - figbloom_crm_staging_backups:/backups:ro

volumes:
  figbloom_crm_staging_backups:
  figbloom_crm_staging_pg:
  figbloom_crm_staging_objects:
  figbloom_crm_staging_clamav_db:
